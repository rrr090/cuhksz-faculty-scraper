[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuhksz-faculty-scraper"
version = "0.2.0"
description = "Scrape every CUHK-Shenzhen school's faculty directory, detect who is recruiting, and build an Obsidian vault, optionally ranked by research fit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["requests>=2.32", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cuhksz-faculty = "cuhksz_faculty.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cuhksz_faculty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
